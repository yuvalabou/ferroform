[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyroid"
version = "1.1.0"
description = "Radially Symmetrical Gyroid Generator & STL Volume Infill Tool"
readme = "README.md"
authors = [
    { name = "PyRoid Team" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20.0",
    "pyvista>=0.43.0",
    "trimesh[easy]>=4.0.0",
    "PyQt5>=5.15.0,<5.15.11",
    "pyvistaqt>=0.11.0",
    "QDarkStyle>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pyinstaller>=6.0.0",
    "maturin>=1.5,<2.0",
]

[project.scripts]
pyroid = "pyroid.main:main"
pyroid-cli = "pyroid.cli:main"

[tool.maturin]
manifest-path = "crates/pyroid-pyo3/Cargo.toml"
module-name = "pyroid_rs"
python-packages = ["pyroid"]

[tool.uv]
override-dependencies = [
    "pyqt5-qt5==5.15.2"
]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["pyroid_rs", "qdarkstyle", "scipy.*"]
ignore_missing_imports = true
